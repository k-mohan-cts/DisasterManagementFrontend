<div class="background-container">
    <div class="login-card">
        <h1 class="login-title">Login</h1>
        
        <form (ngSubmit)="handleLogin()" #loginForm="ngForm">
            <label for="email" class="input-label">Email</label>
            <input type="email" id="email" name="email" [(ngModel)]="credentials.email" class="login-input" placeholder="Enter your email" required>
            
            <label for="password" class="input-label">Password</label>
            <input type="password" id="password" name="passwordHash" [(ngModel)]="credentials.passwordHash" class="login-input" placeholder="Enter your password" required>
            
            <button type="submit" class="login-submit-btn">Login</button>
        </form>
        
        <a href="#" class="forgot-password-link">Forgot password?</a>
    </div>
</div>
