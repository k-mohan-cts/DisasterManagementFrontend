<div class="dashboard-container">
    <app-sidebar role="MANAGER"></app-sidebar>
    
    <div class="main-content">
        <header class="dashboard-header">
            <h2>Recovery Programs</h2>
            <div class="user-profile">
                <button class="pill-btn">Manager</button>
            </div>
        </header>

        <div class="content-body">
            <div class="main-card">
                <div class="card-header">
                    <h3>Active Programs</h3>
                    <button class="btn-add" (click)="openModal()">+ New Program</button>
                </div>
                
                <table class="styled-table">
                    <thead>
                        <tr>
                            <th>Program Name</th>
                            <th>Budget</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let p of programs">
                            <td><strong>{{ p.title }}</strong></td>
                            <td>{{ p.budget | currency:'USD' }}</td>
                            <td>
                                <span class="status-badge" [ngClass]="'badge-' + (p.status?.toLowerCase() || 'planned')">
                                    {{ p.status || 'PLANNED' }}
                                </span>
                            </td>
                            <td>
                                <button class="btn-action-view">Details</button>
                                <!-- NEW: Edit Status Button -->
                                <button class="btn-action-edit" (click)="openStatusModal(p)" style="margin-left: 8px; background-color: #f39c12; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Edit Status</button>
                            </td>
                        </tr>
                        <tr *ngIf="programs.length === 0">
                            <td colspan="4" class="empty-row">No programs found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal Form - Create Program -->
<div class="modal-overlay" *ngIf="showModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Create New Recovery Program</h3>
            <button class="close-x" (click)="closeModal()">&times;</button>
        </div>
        
        <form [formGroup]="programForm" (ngSubmit)="onSubmit()" class="modal-form">
            <div class="form-group">
                <label>Title *</label>
                <input type="text" formControlName="title" class="form-input" placeholder="Enter program title">
                <div class="error-msg" *ngIf="programForm.get('title')?.touched && programForm.get('title')?.invalid">
                    <small>Title must be 3-100 characters (letters required).</small>
                </div>
            </div>

            <div class="form-group">
                <label>Description *</label>
                <textarea formControlName="description" class="form-input" rows="3" placeholder="Describe the recovery effort"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" formControlName="startDate" class="form-input">
                </div>
                <div class="form-group">
                    <label>End Date</label>
                    <input type="date" formControlName="endDate" class="form-input">
                </div>
            </div>

            <div class="form-group">
                <label>Budget ($) *</label>
                <input type="number" formControlName="budget" class="form-input" placeholder="0.00">
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-cancel" (click)="closeModal()">Cancel</button>
                <button type="submit" class="btn-save" [disabled]="programForm.invalid">Create Program</button>
            </div>
        </form>
    </div>
</div>

<!-- NEW: Modal Form - Update Status -->
<div class="modal-overlay" *ngIf="showStatusModal">
    <div class="modal-card" style="max-width: 400px;">
        <div class="modal-header">
            <h3>Update Program Status</h3>
            <button class="close-x" (click)="closeStatusModal()">&times;</button>
        </div>
        
        <div style="padding: 20px;">
            <div class="form-group">
                <label>Select New Status</label>
                <select [(ngModel)]="newStatus" class="form-input" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc;">
                    <option value="PLANNED">PLANNED</option>
                    <option value="ACTIVE">ACTIVE</option>
                    <option value="SUSPENDED">SUSPENDED</option>
                    <option value="COMPLETED">COMPLETED</option>
                    <option value="CANCELLED">CANCELLED</option>
                </select>
            </div>
        </div>

        <div class="modal-footer">
            <button type="button" class="btn-cancel" (click)="closeStatusModal()">Cancel</button>
            <button type="button" class="btn-save" (click)="submitStatusUpdate()">Save Changes</button>
        </div>
    </div>
</div>
