<div class="dashboard-container">
  <app-sidebar role="MANAGER"></app-sidebar>
  
  <div class="main-wrapper">
    <header class="page-header">
      <div class="title-section">
        <h2>Emergency Reports</h2>
      </div>
      <div class="header-actions">
        <button class="pill-btn-outline" routerLink="/manager-dashboard">Manager Dashboard</button>
      </div>
    </header>

    <div class="content-area">
      <div class="card">
        <div *ngIf="isLoading" class="loader">
          <p>Connecting to database...</p>
        </div>

        <table class="data-table" *ngIf="!isLoading">
          <thead>
            <tr>
              <th>Type</th>
              <th>Location</th>
              <th>Date Reported</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let e of emergencies">
              <td>
                <div class="type-cell">
                  <span class="icon">{{ e.type === 'FIRE' ? '🔥' : '💧' }}</span>
                  <span class="type-text">{{ e.type }}</span>
                </div>
              </td>
              <td>{{ e.location }}</td>
              <td>{{ (e.date || e.createdAt) | date:'dd/MM/yyyy' }}</td>
              <td>
                <select [value]="e.status" 
                        (change)="onStatusChange(e.reportId || e.id, $event)" 
                        class="status-select"
                        [ngClass]="e.status.toLowerCase()">
                  <option value="PENDING">Pending</option>
                  <option value="VALIDATED">Validated</option>
                  <option value="REJECTED">Rejected</option>
                  <option value="RESOLVED">Resolved</option>
                </select>
              </td>
              <td>
                <div class="action-buttons">
                  <button *ngIf="e.status === 'VALIDATED'" 
                          class="btn-create-incident" 
                          (click)="navigateToCreateIncident(e)">
                    + Create Incident
                  </button>
                  <button class="btn-view" (click)="viewDetails(e)">View</button>
                </div>
              </td>
            </tr>

            <tr *ngIf="emergencies.length === 0">
              <td colspan="5" class="empty-row">
                No emergency reports found in the database.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
