<div class="dashboard-container">
    <app-sidebar role="MANAGER"></app-sidebar>
    
    <div class="main-wrapper">
        <header>
            <h2>Incident Management</h2>
            <div class="header-actions">
                <button class="pill-btn">Manager</button>
            </div>
        </header>

        <div class="content-area">
            <div class="card">
                <div class="table-header">
                    <h3>Active Incidents</h3>
                    <button class="btn-create">+ New Incident</button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Incident Type</th>
                            <th>Severity</th>
                            <th>Status</th>
                            <th>Created Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let inc of incidents">
                            <td><strong>{{inc.type}}</strong></td>
                            <td><span class="badge" [ngClass]="'badge-' + inc.severity.toLowerCase()">{{inc.severity}}</span></td>
                            <td><span class="badge" [ngClass]="'badge-' + inc.status.toLowerCase()">{{inc.status}}</span></td>
                            <td>{{inc.createdAt | date}}</td>
                            <td><button class="btn-view">Details</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
