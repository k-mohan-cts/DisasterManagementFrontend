<div class="dashboard-container">
  <app-sidebar role="MANAGER"></app-sidebar>
  <div class="main-content">
    <div class="dashboard-body">
      <div class="header-section">
        <h2>Available Resources</h2>
        <button class="btn-create" (click)="openModal()">+ Add Resource</button>
      </div>

      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>Resource Name</th>
              <th>Type</th>
              <th>Quantity</th>
              <th>Price</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of resources">
              <td><strong>{{ item.name }}</strong></td>
              <td><span class="type-pill">{{ item.type }}</span></td>
              <td>{{ item.quantity }} {{ item.unit }}</td>
              <td>{{ item.unitPrice | currency:'USD' }}</td>
              <td>
                <span class="status-badge" [ngClass]="'badge-' + (item.status?.toLowerCase() || 'allocated')">
                  {{ item.status || 'ALLOCATED' }}
                </span>
              </td>
            </tr>
            <tr *ngIf="resources.length === 0">
              <td colspan="5" style="text-align: center; padding: 20px;">No resources found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="showModal">
  <div class="modal-content">
    <div class="modal-header">
        <h3>Create New Resource</h3>
        <button class="close-x" (click)="closeModal()">&times;</button>
    </div>
    <form [formGroup]="resourceForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label>Resource Name *</label>
        <input formControlName="name" class="form-input" placeholder="e.g. Medical Supplies">
      </div>

      <div class="form-group">
        <label>Type *</label>
        <select formControlName="type" class="form-input">
          <option value="" disabled selected>-- Select Type --</option>
          <option value="EQUIPMENT">EQUIPMENT</option>
          <option value="FUNDS">FUNDS</option>
          <option value="PERSONNEL">PERSONNEL</option>
          <option value="VEHICLE">VEHICLE</option>
          <option value="OTHER">OTHER</option>
        </select>
      </div>

      <div class="form-row">
        <div class="half">
          <label>Quantity *</label>
          <input type="number" formControlName="quantity" class="form-input">
        </div>
        <div class="half">
          <label>Unit *</label>
          <input formControlName="unit" class="form-input" placeholder="e.g. Boxes">
        </div>
      </div>

      <div class="form-row">
        <div class="half">
          <label>Unit Price ($) *</label>
          <input type="number" formControlName="unitPrice" class="form-input">
        </div>
        <div class="half">
          <label>Recovery Program *</label>
          <select formControlName="programId" class="form-input">
            <option [ngValue]="null" disabled selected>-- Select Program --</option>
            <option *ngFor="let program of programs" [value]="program.id || program.programId">
              {{ program.name || program.programName || program.title }}
            </option>
          </select>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn-submit" [disabled]="resourceForm.invalid">
          Save Resource
        </button>
      </div>
    </form>
  </div>
</div>
