<div class="dashboard-container">
    <app-sidebar role="MANAGER"></app-sidebar>
    
    <div class="main-wrapper">
        <header>
            <h2>Resource Management</h2>
            <div class="header-actions">
                <button class="pill-btn">Manager</button>
            </div>
        </header>

        <div class="content-area">
            <div class="card">
                <div class="table-header">
                    <h3>Available Resources</h3>
                    <button class="btn-create">+ Add Resource</button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Resource Name</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let r of resources">
                            <td><strong>{{r.resourceName}}</strong></td>
                            <td>{{r.type}}</td>
                            <td><span class="badge" [ngClass]="'badge-' + r.status.toLowerCase()">{{r.status}}</span></td>
                            <td><button class="btn-view">Details</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
