<div class="dashboard-container">
    <app-sidebar role="AUDITOR"></app-sidebar>

    <main class="main-content">
        <header class="topbar">
            <h1>Compliance & Audits</h1>
            <div class="topbar-right">
                <span class="bell">🔔</span>
                <span class="role-chip">Compliance</span>
                <button class="logout-btn"><i class="fas fa-sign-out-alt"></i> Sign out</button>
            </div>
        </header>

        <div class="page-content">
            <div class="page-header">
                <div>
                    <h2>Audit Management</h2>
                    <p>Manage and track internal audits and oversight activities.</p>
                </div>
                <button class="btn-primary" (click)="showModal = true">
                    <i class="fas fa-plus"></i> New Audit Session
                </button>
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Audit ID</th>
                            <th>Officer ID</th>
                            <th>Scope</th>
                            <th>Findings</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let audit of audits">
                            <td><a href="#" class="id-link">{{audit.id}}</a></td>
                            <td>{{audit.officerId}}</td>
                            <td class="scope-cell">{{audit.scope}}</td>
                            <td class="findings-cell" [title]="audit.findings">{{audit.findings}}</td>
                            <td>{{audit.date}}</td>
                            <td>
                                <span class="status-badge" [ngClass]="audit.status.toLowerCase()">
                                    {{audit.status}}
                                </span>
                            </td>
                            <td class="actions-cell"><button class="btn-edit">Edit</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" *ngIf="showModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Initiate New Audit</h2>
                <button class="close-modal" (click)="showModal = false">&times;</button>
            </div>
            <form (ngSubmit)="submitAudit()">
                <div class="input-group">
                    <label>Officer ID</label>
                    <input type="number" name="officerId" [(ngModel)]="newAudit.officerId" required>
                </div>
                <div class="input-group">
                    <label>Scope</label>
                    <input type="text" name="scope" [(ngModel)]="newAudit.scope" placeholder="e.g. Food Distribution Q1" required>
                </div>
                <div class="input-group">
                    <label>Status</label>
                    <select name="status" [(ngModel)]="newAudit.status">
                        <option value="SCHEDULED">Scheduled</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="COMPLETED">Completed</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Findings</label>
                    <textarea name="findings" [(ngModel)]="newAudit.findings"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" (click)="showModal = false">Cancel</button>
                    <button type="submit" class="btn-submit">Create Audit</button>
                </div>
            </form>
        </div>
    </div>
</div>
