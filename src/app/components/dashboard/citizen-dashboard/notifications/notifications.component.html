<div class="dashboard-container">
    <app-sidebar role="CITIZEN"></app-sidebar>
    
    <div class="main-wrapper">
        <nav class="top-navbar">
            <div class="user-actions">
                <i class="far fa-bell"></i>
                <div class="user-circle">J</div>
            </div>
        </nav>

        <main class="content-container">
            <header class="page-header">
                <h1>Notification History</h1>
                <p>Track your recent activity, document status changes, and system alerts.</p>
            </header>

            <div class="notification-list">
                <div class="notif-card" *ngFor="let n of notifications" [ngClass]="n.bgClass">
                    <div class="notif-icon-container">
                        <i class="far" [ngClass]="[n.icon, n.iconClass]"></i>
                    </div>
                    <div class="notif-content">
                        <div class="notif-title-row">
                            <span class="notif-title">{{n.title}}</span>
                            <span class="notif-badge" [ngClass]="n.badgeClass">{{n.status}}</span>
                        </div>
                        <p class="notif-desc" [innerHTML]="n.desc"></p>
                    </div>
                    <div class="notif-date">{{n.date}}</div>
                </div>
            </div>
        </main>
    </div>
</div>
